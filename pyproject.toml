[project]
name = "ticket-to-breathe"
version = "0.1.0"
description = "Did nearly-free public transport clean Germany's air? Causal evaluation of the 9-Euro-Ticket and Deutschlandticket on urban NO2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "holidays>=0.105",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyfixest>=0.60.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
